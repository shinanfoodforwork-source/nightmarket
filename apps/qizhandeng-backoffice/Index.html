<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>七盞燈｜供應鏈後勤營運系統</title>
  <style>
    :root{--bg:#f6f8fb;--surface:#fff;--text:#172033;--muted:#667085;--primary:#0f4c81;--primary2:#12395f;--border:#e4e7ec;--danger:#b42318;--shadow:0 10px 28px rgba(15,76,129,.08)}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}
    .app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,var(--primary2),#0c2944);color:white;padding:17px 13px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:8px 10px 18px;border-bottom:1px solid rgba(255,255,255,.13);margin-bottom:12px}.brand h1{font-size:18px;margin:0 0 5px}.brand p{font-size:12px;margin:0;color:#c9d7e5}
    .navbtn{width:100%;border:0;background:transparent;color:#d9e5f0;text-align:left;padding:10px 11px;border-radius:9px;cursor:pointer;margin:1px 0}.navbtn:hover,.navbtn.active{background:rgba(255,255,255,.12);color:white}.main{min-width:0}.topbar{height:64px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:8;backdrop-filter:blur(10px)}.topbar h2{font-size:19px;margin:0}.content{padding:22px;max-width:1600px;margin:auto}
    .btn{border:1px solid var(--border);background:white;padding:9px 13px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--primary);border-color:var(--primary);color:white}.btn.danger{color:var(--danger)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.label{font-size:13px;color:var(--muted);margin-bottom:9px}.value{font-size:27px;font-weight:700}.note{font-size:12px;color:var(--muted);margin-top:7px}
    .panel{background:white;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.left{display:flex;gap:8px;align-items:center}.search{min-width:260px;border:1px solid var(--border);padding:9px 11px;border-radius:9px}.table-wrap{overflow:auto;max-height:72vh}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}th,td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left;font-size:13px}th{position:sticky;top:0;background:#f8fafc;z-index:2;color:#475467;font-weight:600}tbody tr:hover{background:#f8fbff}.muted{color:var(--muted)}.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 15px}
    .drawer{position:fixed;inset:0;display:none;z-index:20}.drawer.show{display:block}.backdrop{position:absolute;inset:0;background:rgba(15,23,42,.42)}.editor{position:absolute;right:0;top:0;height:100%;width:min(620px,94vw);background:white;overflow:auto;padding:20px;box-shadow:-12px 0 40px rgba(0,0,0,.15)}.editor h3{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input{width:100%;border:1px solid var(--border);padding:10px;border-radius:8px}.editor-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:white;padding:12px 16px;border-radius:10px;display:none;z-index:50}.menu-btn{display:none}
    @media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-280px;width:255px;z-index:30;transition:.2s}.sidebar.open{left:0}.menu-btn{display:inline-block}.topbar{padding:0 14px}.content{padding:14px}}@media(max-width:600px){.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.search{min-width:0;width:100%}.panel-head{align-items:stretch}.left{width:100%}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"><div class="brand"><h1>七盞燈</h1><p>供應鏈後勤營運系統</p></div><div id="nav"></div></aside>
  <main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn menu-btn" onclick="toggleMenu()">選單</button><h2 id="pageTitle">營運儀表板</h2></div><button class="btn" onclick="reloadCurrent()">重新整理</button></header><section class="content" id="content"><div class="muted">系統載入中...</div></section></main>
</div>
<div class="drawer" id="drawer"><div class="backdrop" onclick="closeEditor()"></div><div class="editor"><h3 id="editorTitle">新增資料</h3><div class="form-grid" id="formGrid"></div><div class="editor-actions"><button class="btn" onclick="closeEditor()">取消</button><button class="btn danger" id="deleteBtn" style="display:none" onclick="voidCurrent()">作廢</button><button class="btn primary" onclick="saveCurrent()">儲存</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
let APP=null,currentKey='dashboard',page=1,pageSize=30,search='',currentData=null,editingRow=null;
function gs(fn,...args){return new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)));r[fn](...args)})}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}function closeMobileMenu(){document.getElementById('sidebar').classList.remove('open')}
(async()=>{try{APP=await gs('getBootstrap');renderNav();renderDashboard(APP.dashboard)}catch(e){document.getElementById('content').innerHTML='<div class="card">載入失敗：'+esc(e.message)+'</div>'}})();
function renderNav(){document.getElementById('nav').innerHTML=APP.modules.map(m=>`<button class="navbtn ${m.key===currentKey?'active':''}" data-key="${m.key}" onclick="openModule('${m.key}')">${m.name}</button>`).join('')}
function setActive(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.key===currentKey))}
async function openModule(key){currentKey=key;page=1;search='';setActive();closeMobileMenu();const m=APP.modules.find(x=>x.key===key);document.getElementById('pageTitle').textContent=m.name;if(key==='dashboard'){renderDashboard(await gs('refreshDashboard'));return}await loadTable()}
function renderDashboard(data){document.getElementById('pageTitle').textContent='營運儀表板';const cards=(data||[]).map(x=>`<div class="card"><div class="label">${esc(x.label)}</div><div class="value">${esc(x.value||'0')}</div><div class="note">${esc(x.note||'')}</div></div>`).join('');document.getElementById('content').innerHTML=`<div class="cards">${cards}</div><div class="panel"><div class="panel-head"><strong>後勤主流程</strong></div><div style="padding:18px;line-height:1.9">客戶下單 → 庫存判斷 → 採購 → 入庫驗收 → 庫存 → 揀貨 → 配送 → 簽收 → 對帳損益 → 異常處理 → 稽核。</div></div>`}
async function loadTable(){document.getElementById('content').innerHTML='<div class="muted">資料載入中...</div>';try{currentData=await gs('getModuleData',currentKey,page,pageSize,search);renderTable()}catch(e){document.getElementById('content').innerHTML='<div class="card">讀取失敗：'+esc(e.message)+'</div>'}}
function renderTable(){const d=currentData,m=d.module;const head=d.headers.map(h=>`<th>${esc(h)}</th>`).join('');const body=d.rows.map(r=>`<tr onclick="editRow(${r.rowNumber})">${r.values.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('');const pages=Math.max(1,Math.ceil(d.total/d.pageSize));document.getElementById('content').innerHTML=`<div class="panel"><div class="panel-head"><div class="left"><input class="search" placeholder="搜尋目前模組..." value="${attr(search)}" onkeydown="if(event.key==='Enter'){doSearch(this.value)}"><button class="btn" onclick="doSearch(document.querySelector('.search').value)">搜尋</button></div>${m.readonly?'':'<button class="btn primary" onclick="newRecord()">新增資料</button>'}</div><div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body||`<tr><td colspan="${d.headers.length}" class="muted">目前沒有資料</td></tr>`}</tbody></table></div><div class="pager"><span class="muted">共 ${d.total} 筆｜第 ${d.page}/${pages} 頁</span><button class="btn" ${d.page<=1?'disabled':''} onclick="goPage(${d.page-1})">上一頁</button><button class="btn" ${d.page>=pages?'disabled':''} onclick="goPage(${d.page+1})">下一頁</button></div></div>`}
function doSearch(v){search=v||'';page=1;loadTable()}function goPage(p){page=Math.max(1,p);loadTable()}function reloadCurrent(){openModule(currentKey)}function newRecord(){editingRow=null;openEditor(null)}
function editRow(rowNumber){const m=currentData.module;if(m.readonly)return;editingRow=rowNumber;const row=currentData.rows.find(x=>x.rowNumber===rowNumber);openEditor(row?row.values:null)}
function openEditor(values){document.getElementById('editorTitle').textContent=editingRow?'編輯資料':'新增資料';document.getElementById('deleteBtn').style.display=editingRow?'inline-block':'none';document.getElementById('formGrid').innerHTML=currentData.headers.map((name,i)=>`<div class="field"><label>${esc(name)}</label><input data-field="${attr(name)}" value="${attr(values?values[i]:'')}"></div>`).join('');document.getElementById('drawer').classList.add('show')}
function closeEditor(){document.getElementById('drawer').classList.remove('show');editingRow=null}
async function saveCurrent(){const record={};document.querySelectorAll('#formGrid input').forEach(i=>record[i.dataset.field]=i.value);try{const r=await gs('saveRecord',currentKey,editingRow,record);toast(r.message||'已儲存');closeEditor();await loadTable()}catch(e){toast('儲存失敗：'+e.message)}}
async function voidCurrent(){if(!editingRow||!confirm('確定要作廢這筆資料？系統會留下稽核紀錄。'))return;try{const r=await gs('voidRecord',currentKey,editingRow);toast(r.message);closeEditor();await loadTable()}catch(e){toast('操作失敗：'+e.message)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}function attr(v){return esc(v)}
</script>
</body>
</html>
